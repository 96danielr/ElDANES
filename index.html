
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EL DANES - Elite Finance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            deep: 'var(--bg-deep)',
            surface: { DEFAULT: 'var(--bg-surface)', hover: 'var(--bg-surface-hover)' },
            elevated: 'var(--bg-elevated)',
            accent: { DEFAULT: 'var(--accent)', hover: 'var(--accent-hover)', glow: 'var(--accent-glow)' },
            success: { DEFAULT: 'var(--success)', glow: 'var(--success-glow)' },
            warning: { DEFAULT: 'var(--warning)', glow: 'var(--warning-glow)' },
            danger: { DEFAULT: 'var(--danger)', glow: 'var(--danger-glow)' },
            dpurple: { DEFAULT: 'var(--purple)', glow: 'var(--purple-glow)' },
            cyan: { DEFAULT: 'var(--cyan)' },
          },
          fontFamily: {
            pixel: ['"Press Start 2P"', 'monospace'],
            retro: ['"VT323"', 'monospace'],
          },
          borderRadius: {
            'pixel': '4px',
          }
        }
      }
    }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            /* ★★★ SUPER MARIO WORLD — Danes Finance ★★★ */
            /* Inspired by the 1990 SNES classic overworld map */

            /* Sky & Surfaces */
            --bg-deep: #6CACF0;
            --bg-surface: #FFF8E8;
            --bg-surface-hover: #FFF0C8;
            --bg-elevated: #F0E4C8;
            --bg-overlay: rgba(10, 20, 50, 0.75);

            /* Borders — brick/block tan */
            --border-subtle: rgba(160, 120, 60, 0.15);
            --border-default: #C8A868;
            --border-hover: #986830;

            /* Text — warm browns (WCAG AA compliant on #FFF8E8) */
            --text-primary: #2A1508;       /* ~15:1 contrast */
            --text-secondary: #5C3820;     /* ~7.5:1 contrast */
            --text-tertiary: #7C5830;      /* ~4.6:1 contrast */

            /* ★ Mario Red — fire flower accent */
            --accent: #C83018;             /* ~5.5:1 on cream */
            --accent-hover: #E84030;
            --accent-glow: rgba(200, 48, 24, 0.18);
            --accent-deep: #A01808;

            /* ★ SMW Semantic Palette (AA compliant on light bg) */
            --success: #1E7A3E;            /* ~5.8:1 on cream */
            --success-glow: rgba(30, 122, 62, 0.16);
            --warning: #8A6000;            /* ~5.2:1 on cream */
            --warning-glow: rgba(138, 96, 0, 0.20);
            --danger: #B81818;             /* ~5.5:1 on cream */
            --danger-glow: rgba(184, 24, 24, 0.16);
            --purple: #6A2098;             /* ~6.5:1 on cream */
            --purple-glow: rgba(106, 32, 152, 0.14);
            --cyan: #006890;              /* ~5.2:1 on cream */

            /* Coin gold — used for special highlights */
            --coin: #F8D030;
            --coin-glow: rgba(248, 208, 48, 0.30);

            /* Pixel shadows — warm brown offset */
            --pixel-shadow: 3px 3px 0px rgba(60, 30, 0, 0.22);
            --pixel-shadow-sm: 2px 2px 0px rgba(60, 30, 0, 0.18);
            --pixel-shadow-accent: 3px 3px 0px rgba(200, 40, 16, 0.25);
            --pixel-shadow-inset: inset 0 -2px 0 rgba(60, 30, 0, 0.12);

            /* SMW window chrome — 3D bevel */
            --chrome-highlight: rgba(255, 252, 240, 0.60);
            --chrome-shadow: rgba(100, 60, 10, 0.30);
        }

        * { box-sizing: border-box; }

        /* ═══════════════════════════════════════
           ★ BODY — SMW Overworld Background
           ═══════════════════════════════════════ */
        body {
            font-family: 'VT323', monospace;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
            background: url('/smw-bg.jpg') center center / cover no-repeat fixed #4080C0;
            color: var(--text-primary);
            min-height: 100vh;
            min-height: 100dvh;
            position: relative;
            font-size: 18px;
            letter-spacing: 0.03em;
        }

        /* Subtle dark overlay for readability */
        body::before {
            content: '';
            position: fixed;
            top: -1px; left: -1px; right: -1px; bottom: -1px;
            pointer-events: none;
            z-index: 0;
            background: rgba(0, 20, 60, 0.12);
            -webkit-transform: translateZ(0);
            transform: translateZ(0);
        }

        /* body::after reserved — not used */
        body::after {
            display: none;
        }

        /* Mobile: use scroll instead of fixed (iOS Safari fix) */
        @media (max-width: 768px) {
            body {
                background-attachment: scroll;
                background-position: center top;
                background-size: cover;
            }
        }

        /* ═══════════════════════════════════════
           ★ TYPOGRAPHY — Press Start 2P + VT323
           ═══════════════════════════════════════ */
        h1, h2, .font-display {
            font-family: 'Press Start 2P', monospace;
            text-shadow:
                2px 2px 0px rgba(60, 30, 0, 0.25),
                -1px -1px 0px rgba(255, 255, 240, 0.20);
            line-height: 1.7;
        }

        .font-mono {
            font-family: 'VT323', monospace;
            text-shadow: 1px 1px 0px rgba(60, 30, 0, 0.10);
        }

        /* ═══════════════════════════════════════
           ★ CARDS — SMW ? Block / Message Box
           ═══════════════════════════════════════ */
        .glass-card {
            background:
                linear-gradient(135deg,
                    rgba(255, 248, 220, 0.6) 0%,
                    rgba(248, 232, 190, 0.4) 50%,
                    rgba(240, 220, 170, 0.5) 100%
                ),
                /* Subtle brick texture */
                repeating-linear-gradient(
                    0deg,
                    transparent,
                    transparent 23px,
                    rgba(180, 140, 70, 0.04) 23px,
                    rgba(180, 140, 70, 0.04) 24px
                ),
                repeating-linear-gradient(
                    90deg,
                    transparent,
                    transparent 31px,
                    rgba(180, 140, 70, 0.03) 31px,
                    rgba(180, 140, 70, 0.03) 32px
                ),
                var(--bg-surface);
            border: 4px solid #B89850;
            border-top-color: #F0D888;
            border-left-color: #E0C878;
            border-right-color: #886020;
            border-bottom-color: #785018;
            border-radius: 0px;
            box-shadow:
                4px 4px 0px rgba(60, 30, 0, 0.18),
                inset 0 0 0 2px rgba(255, 250, 220, 0.50),
                inset 0 4px 12px rgba(255, 240, 180, 0.30);
            transition: all 0.12s steps(3);
            position: relative;
            overflow: hidden;
        }

        /* Top stripe — Mario red → coin gold → pipe green */
        .glass-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 5px;
            background: linear-gradient(90deg, #E83820 0%, #F0A800 35%, #F8D030 55%, #40B868 100%);
            pointer-events: none;
            z-index: 1;
        }

        .glass-card:hover {
            border-color: #D8A030;
            border-top-color: #F8E098;
            border-left-color: #F0D080;
            border-right-color: #A87020;
            border-bottom-color: #906018;
            box-shadow:
                5px 5px 0px rgba(160, 100, 10, 0.16),
                0 0 24px var(--coin-glow),
                inset 0 0 0 2px rgba(248, 208, 48, 0.18),
                inset 0 4px 16px rgba(255, 240, 180, 0.40);
            transform: translate(-2px, -3px);
        }

        /* ★ Color variants — full tinted backgrounds like SMW level types */
        .glass-card.glass-green {
            background:
                linear-gradient(135deg,
                    rgba(64, 200, 104, 0.10) 0%,
                    rgba(56, 180, 90, 0.06) 50%,
                    rgba(48, 160, 80, 0.12) 100%
                ),
                var(--bg-surface);
            border-left: 6px solid #38A848;
            border-top-color: #80E098;
            box-shadow: 4px 4px 0px rgba(30, 80, 40, 0.14), inset 5px 0 20px rgba(64, 184, 104, 0.10), inset 0 0 0 2px rgba(64, 200, 104, 0.08);
        }
        .glass-card.glass-red {
            background:
                linear-gradient(135deg,
                    rgba(220, 40, 30, 0.08) 0%,
                    rgba(200, 30, 20, 0.04) 50%,
                    rgba(180, 20, 10, 0.10) 100%
                ),
                var(--bg-surface);
            border-left: 6px solid #C82020;
            border-top-color: #F08070;
            box-shadow: 4px 4px 0px rgba(100, 20, 10, 0.14), inset 5px 0 20px rgba(208, 32, 32, 0.08), inset 0 0 0 2px rgba(220, 40, 30, 0.06);
        }
        .glass-card.glass-yellow {
            background:
                linear-gradient(135deg,
                    rgba(248, 200, 0, 0.12) 0%,
                    rgba(240, 180, 0, 0.06) 50%,
                    rgba(230, 160, 0, 0.14) 100%
                ),
                var(--bg-surface);
            border-left: 6px solid #D8A000;
            border-top-color: #F8D860;
            box-shadow: 4px 4px 0px rgba(120, 80, 0, 0.14), inset 5px 0 20px rgba(240, 168, 0, 0.10), inset 0 0 0 2px rgba(248, 200, 0, 0.08);
        }
        .glass-card.glass-purple {
            background:
                linear-gradient(135deg,
                    rgba(144, 48, 200, 0.08) 0%,
                    rgba(130, 40, 180, 0.04) 50%,
                    rgba(120, 30, 170, 0.10) 100%
                ),
                var(--bg-surface);
            border-left: 6px solid #8030B0;
            border-top-color: #C080E0;
            box-shadow: 4px 4px 0px rgba(60, 20, 80, 0.14), inset 5px 0 20px rgba(144, 48, 192, 0.08), inset 0 0 0 2px rgba(144, 48, 200, 0.06);
        }
        .glass-card.glass-blue {
            background:
                linear-gradient(135deg,
                    rgba(232, 56, 32, 0.08) 0%,
                    rgba(220, 48, 28, 0.04) 50%,
                    rgba(200, 40, 20, 0.10) 100%
                ),
                var(--bg-surface);
            border-left: 6px solid #D03018;
            border-top-color: #F08060;
            box-shadow: 4px 4px 0px rgba(100, 20, 10, 0.14), inset 5px 0 20px rgba(232, 56, 32, 0.08), inset 0 0 0 2px rgba(232, 56, 32, 0.06);
        }

        /* ═══════════════════════════════════════
           ★ NAVIGATION — SMW World Map HUD
           ═══════════════════════════════════════ */
        .nav-glass {
            background:
                linear-gradient(180deg, #FFF8D8 0%, #F0DEB0 100%),
                repeating-linear-gradient(
                    90deg,
                    transparent,
                    transparent 47px,
                    rgba(180, 140, 60, 0.05) 47px,
                    rgba(180, 140, 60, 0.05) 48px
                );
            border: 4px solid #B89040;
            border-top-color: #F0D878;
            border-left-color: #E0C468;
            border-right-color: #886020;
            border-bottom-color: #785018;
            border-radius: 0px;
            box-shadow:
                4px 4px 0px rgba(60, 30, 0, 0.16),
                inset 0 2px 0 rgba(255, 250, 220, 0.6),
                inset 0 -1px 0 rgba(120, 80, 20, 0.1);
            -webkit-transform: translateZ(0);
            transform: translateZ(0);
            will-change: transform;
        }

        /* ═══════════════════════════════════════
           ★ INPUTS — SMW Text Box
           ═══════════════════════════════════════ */
        input, textarea, select {
            font-size: 16px !important;
            font-family: 'VT323', monospace !important;
        }

        @media screen and (min-width: 768px) {
            input, textarea, select {
                font-size: inherit !important;
            }
        }

        .input-glass {
            background:
                linear-gradient(180deg, #FFF0C8 0%, #FFF6DC 100%);
            border: 3px solid #B89850;
            border-top-color: #886028;
            border-left-color: #987838;
            border-right-color: #E0D0A0;
            border-bottom-color: #F0E0B8;
            border-radius: 0px;
            color: var(--text-primary);
            transition: all 0.1s steps(2);
            font-family: 'VT323', monospace;
            box-shadow: inset 2px 2px 4px rgba(100, 60, 10, 0.10);
        }

        .input-glass:focus {
            outline: none;
            border-color: #E8B020;
            background: linear-gradient(180deg, #FFF8D8 0%, #FFFAE8 100%);
            box-shadow:
                0 0 0 3px var(--coin-glow),
                0 0 20px rgba(248, 208, 48, 0.22),
                inset 2px 2px 4px rgba(100, 60, 10, 0.06);
        }

        .input-glass::placeholder {
            color: var(--text-tertiary);
        }

        /* ═══════════════════════════════════════
           ★ BUTTONS — SMW ! Switch / ? Block
           ═══════════════════════════════════════ */
        .btn-primary {
            background: linear-gradient(180deg, #F04028 0%, #C82010 100%);
            border: 4px solid;
            border-top-color: #F87060;
            border-left-color: #F06050;
            border-right-color: #901008;
            border-bottom-color: #780808;
            color: white;
            font-weight: 700;
            font-family: 'Press Start 2P', monospace;
            font-size: 10px;
            transition: all 0.05s steps(1);
            box-shadow:
                var(--pixel-shadow-accent),
                inset 0 2px 0 rgba(255, 255, 255, 0.25);
            border-radius: 0px;
            text-shadow: 2px 2px 0px rgba(0, 0, 0, 0.40);
            position: relative;
            overflow: hidden;
        }

        .btn-primary::after {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 50%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.22), transparent);
            transition: left 0.3s ease;
        }
        .btn-primary:hover::after { left: 100%; }

        .btn-primary:hover {
            background: linear-gradient(180deg, #F85040 0%, #E83820 100%);
            box-shadow: 2px 2px 0px rgba(200, 40, 16, 0.22), 0 0 14px var(--accent-glow);
            transform: translate(2px, 2px);
            border-top-color: #FF8878;
            border-left-color: #F87868;
            border-right-color: #A81810;
            border-bottom-color: #901010;
        }

        .btn-primary:active {
            transform: translate(3px, 3px);
            box-shadow: none;
            background: #B01808;
            border-top-color: #780808;
            border-left-color: #780808;
            border-right-color: #F06050;
            border-bottom-color: #F87060;
        }

        .btn-secondary {
            background: linear-gradient(180deg, #F0E4C8 0%, #D8C8A0 100%);
            border: 3px solid;
            border-top-color: #FFF8E0;
            border-left-color: #F0E0C0;
            border-right-color: #A08040;
            border-bottom-color: #907030;
            color: var(--text-primary);
            font-family: 'VT323', monospace;
            transition: all 0.05s steps(1);
            border-radius: 0px;
            box-shadow: var(--pixel-shadow-sm);
        }

        .btn-secondary:hover {
            background: linear-gradient(180deg, #FFF0D0 0%, #E0D0B0 100%);
            transform: translate(2px, 2px);
            box-shadow: none;
        }

        .btn-danger {
            background: linear-gradient(180deg, #D02020 0%, #A81010 100%);
            border: 3px solid;
            border-top-color: #E86060;
            border-left-color: #E05050;
            border-right-color: #801010;
            border-bottom-color: #680808;
            color: white;
            font-family: 'VT323', monospace;
            transition: all 0.05s steps(1);
            border-radius: 0px;
            text-shadow: 2px 2px 0px rgba(0, 0, 0, 0.40);
            box-shadow: var(--pixel-shadow-sm);
        }

        .btn-danger:hover {
            transform: translate(2px, 2px);
            box-shadow: none;
            background: linear-gradient(180deg, #E03030 0%, #C01818 100%);
        }

        /* ═══════════════════════════════════════
           ★ METRIC CARDS — ? Block Power-Ups
           ═══════════════════════════════════════ */
        .metric-card {
            background:
                linear-gradient(160deg,
                    rgba(255, 245, 200, 0.7) 0%,
                    rgba(248, 228, 170, 0.5) 40%,
                    rgba(240, 215, 150, 0.6) 100%
                ),
                /* ? block diagonal pattern */
                repeating-linear-gradient(
                    45deg,
                    transparent,
                    transparent 8px,
                    rgba(200, 160, 60, 0.04) 8px,
                    rgba(200, 160, 60, 0.04) 9px
                ),
                var(--bg-surface);
            border: 4px solid #C8A048;
            border-top-color: #F0D878;
            border-left-color: #E0C468;
            border-right-color: #886020;
            border-bottom-color: #785018;
            border-radius: 0px;
            box-shadow:
                4px 4px 0px rgba(80, 40, 0, 0.18),
                inset 0 0 0 2px rgba(255, 248, 200, 0.45),
                inset 0 3px 10px rgba(255, 235, 160, 0.35);
            transition: all 0.12s steps(3);
            position: relative;
            overflow: hidden;
        }

        .metric-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 5px;
            pointer-events: none;
        }

        .metric-card::after {
            content: '?';
            position: absolute;
            bottom: -8px; right: 2px;
            font-family: 'Press Start 2P', monospace;
            font-size: 40px;
            opacity: 0.05;
            pointer-events: none;
            color: #A08030;
        }

        .metric-card:hover {
            border-color: #D8A830;
            border-top-color: #F8E088;
            box-shadow:
                5px 5px 0px rgba(80, 40, 0, 0.16),
                0 0 16px var(--coin-glow),
                inset 0 0 0 2px rgba(248, 208, 48, 0.20);
            transform: translate(-2px, -3px);
        }

        .metric-card.blue::before { background: var(--accent); }
        .metric-card.purple::before { background: var(--purple); }
        .metric-card.emerald::before { background: var(--success); }
        .metric-card.cyan::before { background: var(--cyan); }
        .metric-card.yellow::before { background: var(--warning); }
        .metric-card.red::before { background: var(--danger); }
        .metric-card.orange::before { background: var(--accent); }

        .metric-card:hover .bg-accent\/20,
        .metric-card:hover .bg-success\/20,
        .metric-card:hover .bg-dpurple\/20,
        .metric-card:hover .bg-danger\/20,
        .metric-card:hover .bg-warning\/20,
        .metric-card:hover .bg-cyan\/20 {
            box-shadow: 0 0 10px currentColor;
        }

        /* ═══════════════════════════════════════
           ★ SCROLLBAR — Warp Pipe Green
           ═══════════════════════════════════════ */
        ::-webkit-scrollbar { width: 14px; height: 14px; }

        ::-webkit-scrollbar-track {
            background: #E8DCC0;
            border-left: 3px solid #C8B888;
        }

        ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #48C050 0%, #38A040 100%);
            border: 3px solid #E8DCC0;
            border-radius: 0;
            box-shadow: inset 1px 1px 0 rgba(255,255,255,0.25), inset -1px -1px 0 rgba(0,60,0,0.2);
        }

        ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(180deg, #58D060 0%, #40B048 100%);
        }

        ::-webkit-scrollbar-corner { background: #E8DCC0; }

        /* Hide number input spinners */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] { -moz-appearance: textfield; }

        /* ═══════════════════════════════════════
           ★ ANIMATIONS — Pixel Stepped + SMW
           ═══════════════════════════════════════ */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideInFromBottom {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pixelPulse {
            0%, 100% { opacity: 1; box-shadow: 0 0 0 0 var(--coin-glow); }
            50% { opacity: 0.92; box-shadow: 0 0 10px 3px var(--coin-glow); }
        }

        @keyframes coinShimmer {
            0% { border-color: var(--warning); }
            33% { border-color: var(--coin); }
            66% { border-color: #E0C020; }
            100% { border-color: var(--warning); }
        }

        /* Coin bounce — like hitting a ? block */
        @keyframes coinBounce {
            0% { transform: translateY(0); }
            30% { transform: translateY(-6px); }
            50% { transform: translateY(-3px); }
            70% { transform: translateY(-1px); }
            100% { transform: translateY(0); }
        }

        .animate-fade-in-up { animation: fadeInUp 0.3s steps(6) forwards; }
        .animate-fade-in { animation: fadeIn 0.2s steps(4) forwards; }
        .animate-slide-up { animation: slideInFromBottom 0.3s steps(6) forwards; }
        .animate-pulse { animation: pixelPulse 2s steps(8) infinite; }

        .delay-100 { animation-delay: 100ms; }
        .delay-200 { animation-delay: 200ms; }
        .delay-300 { animation-delay: 300ms; }
        .delay-400 { animation-delay: 400ms; }
        .delay-500 { animation-delay: 500ms; }

        /* ═══════════════════════════════════════
           ★ BADGES — SMW Item Blocks
           ═══════════════════════════════════════ */
        .badge {
            display: inline-flex;
            align-items: center;
            padding: 4px 10px;
            border-radius: 0px;
            font-size: 15px;
            font-weight: 400;
            font-family: 'VT323', monospace;
            letter-spacing: 0.06em;
            border: 3px solid;
            text-shadow: 1px 1px 0px rgba(255, 255, 240, 0.5);
            box-shadow: var(--pixel-shadow-sm);
            position: relative;
        }

        .badge-success {
            background: linear-gradient(180deg, rgba(80, 210, 120, 0.22) 0%, rgba(50, 170, 80, 0.18) 100%);
            color: #208040;
            border-color: #48A858;
            border-top-color: #78D888;
            border-left-color: #60C870;
            border-right-color: #288838;
            border-bottom-color: #207828;
        }
        .badge-warning {
            background: linear-gradient(180deg, rgba(255, 210, 40, 0.22) 0%, rgba(230, 170, 0, 0.18) 100%);
            color: #806000;
            border-color: #C09020;
            border-top-color: #F0C848;
            border-left-color: #E0B838;
            border-right-color: #907010;
            border-bottom-color: #806008;
        }
        .badge-danger {
            background: linear-gradient(180deg, rgba(230, 60, 50, 0.18) 0%, rgba(200, 30, 20, 0.15) 100%);
            color: #A81818;
            border-color: #C82020;
            border-top-color: #E86060;
            border-left-color: #D84848;
            border-right-color: #881010;
            border-bottom-color: #780808;
        }
