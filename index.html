
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EL DANES - Elite Finance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Tema AWS - Minimalista */
            --glass-bg: rgba(255, 255, 255, 0.85);
            --glass-bg-hover: rgba(255, 255, 255, 0.95);
            --glass-border: rgba(232, 234, 237, 0.8);
            --glass-border-hover: rgba(232, 234, 237, 1);
            --glass-glow: rgba(255, 153, 0, 0.05);
            --glass-shadow: rgba(0, 0, 0, 0.04);
            --glass-highlight: rgba(255, 255, 255, 0.9);
            --bg-primary: #ffffff;
            --text-primary: #232f3e;
            --text-secondary: #545b64;
            --aws-orange: #FF9900;
            --aws-blue: #146eb4;
            --aws-gray: #232f3e;
            --aws-light-gray: #f7f7f7;
        }
        
        body {
            font-family: 'Nunito', sans-serif;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
            background: #f7f7f7;
            color: var(--text-primary);
            transition: color 0.3s ease;
            position: relative;
            min-height: 100vh;
        }
        /* Prevenir zoom automático en inputs en móviles */
        input, textarea, select {
            font-size: 16px !important;
        }
        @media screen and (min-width: 768px) {
            input, textarea, select {
                font-size: inherit !important;
            }
        }
        .glass-card {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            box-shadow: 
                0 1px 3px 0 rgba(0, 0, 0, 0.1),
                0 1px 2px 0 rgba(0, 0, 0, 0.06);
            border-radius: 8px;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }
        .glass-card:hover {
            box-shadow: 
                0 4px 6px -1px rgba(0, 0, 0, 0.1),
                0 2px 4px -1px rgba(0, 0, 0, 0.06);
            border-color: #d1d5db;
            transform: translateY(-1px);
        }
        .bg-blob {
            position: fixed;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            filter: blur(100px) saturate(100%);
            z-index: -1;
            opacity: 0.08;
            pointer-events: none;
            animation: drift 40s infinite alternate ease-in-out;
        }
        .bg-blob-1 {
            top: -150px;
            left: -150px;
            background: radial-gradient(circle, rgba(255, 153, 0, 0.15) 0%, rgba(255, 153, 0, 0.05) 50%, transparent 100%);
            animation: drift 45s infinite alternate ease-in-out;
        }
        .bg-blob-2 {
            bottom: -200px;
            right: -150px;
            background: radial-gradient(circle, rgba(100, 116, 139, 0.12) 0%, rgba(100, 116, 139, 0.04) 50%, transparent 100%);
            animation: drift 50s infinite alternate-reverse ease-in-out;
        }
        .bg-blob-3 {
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle, rgba(148, 163, 184, 0.1) 0%, rgba(148, 163, 184, 0.03) 50%, transparent 100%);
            animation: drift 55s infinite alternate ease-in-out;
        }
        .bg-blob-4 {
            top: 20%;
            right: 10%;
            background: radial-gradient(circle, rgba(255, 153, 0, 0.1) 0%, rgba(255, 153, 0, 0.03) 50%, transparent 100%);
            animation: drift 48s infinite alternate-reverse ease-in-out;
        }
        @keyframes drift {
            0% { transform: translate(-5%, -5%) scale(1) rotate(0deg); }
            100% { transform: translate(5%, 5%) scale(1.1) rotate(3deg); }
        }
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
          -webkit-appearance: none;
          margin: 0;
        }
        input[type=number] {
          -moz-appearance: textfield;
        }
        ::-webkit-scrollbar {
          width: 8px;
        }
        ::-webkit-scrollbar-track {
          background: rgba(241, 245, 249, 0.5);
          backdrop-filter: blur(10px);
          -webkit-backdrop-filter: blur(10px);
          border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
          background: linear-gradient(180deg, 
            rgba(59, 130, 246, 0.3) 0%, 
            rgba(59, 130, 246, 0.2) 100%);
          backdrop-filter: blur(10px);
          -webkit-backdrop-filter: blur(10px);
          border: 1px solid rgba(59, 130, 246, 0.15);
          border-radius: 10px;
          box-shadow: 0 2px 8px rgba(59, 130, 246, 0.1) inset;
        }
        ::-webkit-scrollbar-thumb:hover {
          background: linear-gradient(180deg, 
            rgba(59, 130, 246, 0.5) 0%, 
            rgba(59, 130, 246, 0.4) 100%);
          border-color: rgba(59, 130, 246, 0.3);
          box-shadow: 0 2px 12px rgba(59, 130, 246, 0.2) inset;
        }
        .text-gradient {
            background: linear-gradient(135deg, #146eb4 0%, #0f5a8f 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .nav-glass {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            box-shadow: 
                0 1px 3px 0 rgba(0, 0, 0, 0.1),
                0 1px 2px 0 rgba(0, 0, 0, 0.06);
            transition: all 0.2s ease;
            position: relative;
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",

    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2.45.1"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body>
    <div class="bg-blob bg-blue-400 top-[-25%] left-[-15%]"></div>
    <div class="bg-blob bg-blue-500 bottom-[-25%] right-[-15%]"></div>
    <div class="bg-blob bg-blob-4"></div>
    
    <div id="root"></div>
    <script>
        // Tema claro único - eliminar cualquier tema oscuro guardado
        localStorage.setItem('theme', 'light');
        document.documentElement.classList.remove('dark');
        document.documentElement.classList.add('light');
    </script>
<script type="module" src="/index.tsx"></script>
</body>
</html>
