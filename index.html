
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EL DANES - Elite Finance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            deep:     'rgb(var(--deep-rgb) / <alpha-value>)',
            surface:  { DEFAULT: 'rgb(var(--surface-rgb) / <alpha-value>)', hover: 'rgb(var(--surface-hover-rgb) / <alpha-value>)' },
            elevated: 'rgb(var(--elevated-rgb) / <alpha-value>)',
            accent:   { DEFAULT: 'rgb(var(--accent-rgb) / <alpha-value>)', hover: 'rgb(var(--accent-hover-rgb) / <alpha-value>)', glow: 'rgb(var(--accent-rgb) / 0.20)' },
            success:  { DEFAULT: 'rgb(var(--success-rgb) / <alpha-value>)', glow: 'rgb(var(--success-rgb) / 0.15)' },
            warning:  { DEFAULT: 'rgb(var(--warning-rgb) / <alpha-value>)', glow: 'rgb(var(--warning-rgb) / 0.15)' },
            danger:   { DEFAULT: 'rgb(var(--danger-rgb) / <alpha-value>)', glow: 'rgb(var(--danger-rgb) / 0.15)' },
            dpurple:  { DEFAULT: 'rgb(var(--accent-rgb) / <alpha-value>)', glow: 'rgb(var(--accent-rgb) / 0.20)' },
            cyan:     { DEFAULT: 'rgb(var(--cyan-rgb) / <alpha-value>)' },
          },
          fontFamily: {
            sans: ['"Inter"', 'system-ui', 'sans-serif'],
          },
        }
      }
    }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
    /* ========================================
       NU BANK LIGHT THEME — ElDANES
       ======================================== */

    :root {
        /* RGB tokens (Tailwind opacity modifier support) */
        --deep-rgb:         247 247 248;
        --surface-rgb:      255 255 255;
        --surface-hover-rgb:248 248 250;
        --elevated-rgb:     255 255 255;

        --accent-rgb:       138 5 190;
        --accent-hover-rgb: 107 4 146;
        --success-rgb:      0 168 120;
        --warning-rgb:      245 166 35;
        --danger-rgb:       222 53 11;
        --cyan-rgb:         6 182 212;

        /* Brand */
        --nu-purple:         #8A05BE;
        --nu-purple-hover:   #6B0492;
        --nu-purple-deep:    #4B0082;
        --nu-purple-tint:    #F2E5FF;
        --nu-purple-tint-2:  #EBD9FB;

        /* Surfaces */
        --bg-page:           #F7F7F8;
        --bg-deep:           #F7F7F8;
        --bg-surface:        #FFFFFF;
        --bg-surface-hover:  #FAFAFB;
        --bg-elevated:       #FFFFFF;
        --bg-subtle:         #F2F2F4;
        --bg-subtle-2:       #EAEAEC;
        --bg-overlay:        rgba(28,28,28,0.45);

        /* Accent aliases (used directly in TSX via var()) */
        --accent:           var(--nu-purple);
        --accent-hover:     var(--nu-purple-hover);
        --accent-glow:      rgba(138,5,190,0.18);
        --accent-deep:      var(--nu-purple-deep);

        --purple:           var(--nu-purple);
        --purple-glow:      rgba(138,5,190,0.18);

        --success:          #00A878;
        --success-glow:     rgba(0,168,120,0.15);
        --success-tint:     #D6F5E8;
        --warning:          #F5A623;
        --warning-glow:     rgba(245,166,35,0.15);
        --warning-tint:     #FDEED3;
        --danger:           #DE350B;
        --danger-glow:      rgba(222,53,11,0.15);
        --danger-tint:      #FBE0D7;
        --cyan:             #06B6D4;

        /* Text */
        --text-primary:     #1C1C1C;
        --text-secondary:   #5C5C5C;
        --text-tertiary:    #9B9B9B;

        /* Borders */
        --border-subtle:    #F0F0F2;
        --border-default:   #E5E5E7;
        --border-hover:     #D1D1D4;
        --border-accent:    rgba(138,5,190,0.30);

        /* Legacy aliases (kept for TSX compatibility) */
        --coin:             var(--nu-purple);
        --coin-glow:        rgba(138,5,190,0.20);
        --pixel-shadow:     none;
        --pixel-shadow-sm:  none;
        --pixel-shadow-accent: none;
        --pixel-shadow-inset: none;
        --chrome-highlight: rgba(255,255,255,0.10);
        --chrome-shadow:    rgba(0,0,0,0.04);

        /* Card shadows */
        --shadow-card:      0 1px 2px rgba(16,24,40,0.04), 0 1px 3px rgba(16,24,40,0.04);
        --shadow-card-hover:0 2px 4px rgba(16,24,40,0.05), 0 8px 24px rgba(16,24,40,0.06);
        --shadow-pop:       0 12px 32px rgba(16,24,40,0.10);
    }

    *, *::before, *::after { box-sizing: border-box; }

    /* ═══════════════════════════════════════
       BODY
       ═══════════════════════════════════════ */
    body {
        font-family: 'Inter', system-ui, sans-serif;
        -webkit-tap-highlight-color: transparent;
        overflow-x: hidden;
        background-color: var(--bg-page);
        background-image: none;
        color: var(--text-primary);
        min-height: 100vh;
        min-height: 100dvh;
        font-size: 15px;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
    }

    /* ═══════════════════════════════════════
       TYPOGRAPHY
       ═══════════════════════════════════════ */
    h1, h2, h3, h4, .font-display {
        font-family: 'Inter', system-ui, sans-serif;
        font-weight: 600;
        color: var(--text-primary);
        line-height: 1.3;
        letter-spacing: -0.01em;
    }

    .font-mono {
        font-family: 'Inter', system-ui, sans-serif;
        font-weight: 500;
        font-variant-numeric: tabular-nums;
    }

    input, textarea, select {
        font-size: 16px !important;
        font-family: 'Inter', system-ui, sans-serif !important;
    }

    @media screen and (min-width: 768px) {
        input, textarea, select { font-size: inherit !important; }
    }

    /* ═══════════════════════════════════════
       CARDS  —  flat white, soft shadow
       ═══════════════════════════════════════ */
    .glass-card {
        background: var(--bg-surface);
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
        border: 1px solid var(--border-default);
        border-radius: 16px;
        box-shadow: var(--shadow-card);
        transition: border-color 200ms ease-out, box-shadow 200ms ease-out, transform 200ms ease-out;
        position: relative;
        overflow: hidden;
    }

    .glass-card:hover {
        border-color: var(--border-hover);
        box-shadow: var(--shadow-card-hover);
    }

    .glass-card.glass-green,
    .glass-card.glass-red,
    .glass-card.glass-yellow,
    .glass-card.glass-purple,
    .glass-card.glass-blue {
        border-color: var(--border-default);
    }
    .glass-card.glass-green:hover,
    .glass-card.glass-red:hover,
    .glass-card.glass-yellow:hover,
    .glass-card.glass-purple:hover,
    .glass-card.glass-blue:hover {
        border-color: var(--border-hover);
        box-shadow: var(--shadow-card-hover);
    }

    /* ═══════════════════════════════════════
       NAVIGATION
       ═══════════════════════════════════════ */
    .nav-glass {
        background: var(--bg-surface);
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
        border-bottom: 1px solid var(--border-default);
    }

    /* ═══════════════════════════════════════
       INPUTS
       ═══════════════════════════════════════ */
    .input-glass {
        background: var(--bg-surface);
        border: 1px solid var(--border-default);
        border-radius: 12px;
        color: var(--text-primary);
        transition: border-color 150ms ease-out, box-shadow 150ms ease-out;
        font-family: 'Inter', system-ui, sans-serif;
    }

    .input-glass:focus {
        outline: none;
        border-color: var(--nu-purple);
        box-shadow: 0 0 0 3px rgba(138,5,190,0.15);
    }

    .input-glass::placeholder {
        color: var(--text-tertiary);
    }

    /* ═══════════════════════════════════════
       BUTTONS
       ═══════════════════════════════════════ */
    .btn-primary {
        background: var(--nu-purple);
        border: none;
        color: #FFFFFF;
        font-weight: 600;
        font-family: 'Inter', system-ui, sans-serif;
        font-size: 14px;
        border-radius: 12px;
        cursor: pointer;
        box-shadow: 0 2px 8px rgba(138,5,190,0.20);
        transition: background 150ms ease-out, box-shadow 150ms ease-out, transform 100ms ease-out;
        position: relative;
        overflow: hidden;
    }

    .btn-primary:hover {
        background: var(--nu-purple-hover);
        box-shadow: 0 4px 14px rgba(138,5,190,0.28);
    }

    .btn-primary:active {
        transform: translateY(1px);
        box-shadow: 0 1px 4px rgba(138,5,190,0.20);
    }

    .btn-primary:disabled {
        opacity: 0.40;
        pointer-events: none;
    }

    .btn-secondary {
        background: var(--bg-surface);
        border: 1px solid var(--border-default);
        color: var(--text-primary);
        font-family: 'Inter', system-ui, sans-serif;
        font-weight: 500;
        border-radius: 12px;
        cursor: pointer;
        transition: border-color 150ms ease-out, background 150ms ease-out;
    }

    .btn-secondary:hover {
        border-color: var(--nu-purple);
        background: var(--nu-purple-tint);
        color: var(--nu-purple-deep);
    }

    .btn-danger {
        background: var(--bg-surface);
        border: 1px solid var(--danger);
        color: var(--danger);
        font-family: 'Inter', system-ui, sans-serif;
        font-weight: 500;
        border-radius: 12px;
        cursor: pointer;
        transition: background 150ms ease-out, border-color 150ms ease-out;
    }

    .btn-danger:hover {
        background: var(--danger-tint);
        border-color: var(--danger);
    }

    /* ═══════════════════════════════════════
       METRIC CARDS
       ═══════════════════════════════════════ */
    .metric-card {
        background: var(--bg-surface);
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
        border: 1px solid var(--border-default);
        border-radius: 16px;
        overflow: hidden;
        transition: border-color 200ms ease-out, box-shadow 200ms ease-out, transform 200ms ease-out;
        position: relative;
        box-shadow: var(--shadow-card);
    }

    .metric-card:hover {
        border-color: var(--border-hover);
        box-shadow: var(--shadow-card-hover);
    }

    /* ═══════════════════════════════════════
       SCROLLBAR
       ═══════════════════════════════════════ */
    ::-webkit-scrollbar { width: 8px; height: 8px; }

    ::-webkit-scrollbar-track {
        background: transparent;
    }

    ::-webkit-scrollbar-thumb {
        background: rgba(138,5,190,0.30);
        border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
        background: rgba(138,5,190,0.55);
    }

    ::-webkit-scrollbar-corner {
        background: transparent;
    }

    /* Hide number input spinners */
    input::-webkit-outer-spin-button,
    input::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
    }
    input[type=number] { -moz-appearance: textfield; }

    /* ═══════════════════════════════════════
       ANIMATIONS
       ═══════════════════════════════════════ */
    @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(8px); }
        to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeIn {
        from { opacity: 0; }
        to   { opacity: 1; }
    }

    @keyframes slideInFromBottom {
        from { opacity: 0; transform: translateY(16px); }
        to   { opacity: 1; transform: translateY(0); }
    }

    .animate-fade-in-up  { animation: fadeInUp 0.25s ease-out forwards; }
    .animate-fade-in     { animation: fadeIn 0.20s ease-out forwards; }
    .animate-slide-up    { animation: slideInFromBottom 0.28s ease-out forwards; }

    .delay-100 { animation-delay: 100ms; }
    .delay-200 { animation-delay: 200ms; }
    .delay-300 { animation-delay: 300ms; }
    .delay-400 { animation-delay: 400ms; }
    .delay-500 { animation-delay: 500ms; }

    /* ═══════════════════════════════════════
       BADGES — Nu pills
       ═══════════════════════════════════════ */
    .badge {
        display: inline-flex;
        align-items: center;
        padding: 4px 12px;
        border-radius: 9999px;
        font-size: 12px;
        font-weight: 600;
        font-family: 'Inter', system-ui, sans-serif;
        letter-spacing: 0;
        border: 1px solid transparent;
    }

    .badge-success {
        background: var(--success-tint);
        color: #00754F;
        border-color: transparent;
    }

    .badge-warning {
        background: var(--warning-tint);
        color: #8A5B0F;
        border-color: transparent;
    }

    .badge-danger {
        background: var(--danger-tint);
        color: #A2270A;
        border-color: transparent;
    }

    .badge-info {
        background: var(--nu-purple-tint);
        color: var(--nu-purple-deep);
        border-color: transparent;
    }

    /* ═══════════════════════════════════════
       MODAL OVERLAY
       ═══════════════════════════════════════ */
    .modal-overlay {
        background: rgba(28,28,28,0.45);
    }

    /* ═══════════════════════════════════════
       TABLE
       ═══════════════════════════════════════ */
    .table-glass {
        background: var(--bg-surface);
        border-radius: 16px;
        border: 1px solid var(--border-default);
        overflow: hidden;
        box-shadow: var(--shadow-card);
    }

    .table-glass th {
        background: var(--bg-subtle);
        color: var(--text-secondary);
        font-weight: 600;
        font-family: 'Inter', system-ui, sans-serif;
        text-transform: none;
        font-size: 12px;
        letter-spacing: 0;
        border-bottom: 1px solid var(--border-default);
    }

    .table-glass tr {
        border-bottom: 1px solid var(--border-subtle);
        transition: background 150ms ease-out;
    }

    .table-glass tr:hover {
        background: var(--nu-purple-tint);
    }

    .table-glass tr:last-child {
        border-bottom: none;
    }

    /* ═══════════════════════════════════════
       COLORED TEXT
       ═══════════════════════════════════════ */
    .text-accent  { color: var(--nu-purple) !important; }
    .text-success { color: var(--success) !important; }
    .text-warning { color: #B97A0F !important; }
    .text-danger  { color: var(--danger) !important; }
    .text-dpurple { color: var(--nu-purple) !important; }
    .text-cyan    { color: var(--cyan) !important; }

    /* ═══════════════════════════════════════
       SELECTION & FOCUS
       ═══════════════════════════════════════ */
    ::selection {
        background: rgba(138,5,190,0.20);
        color: var(--text-primary);
    }

    :focus-visible {
        outline: 2px solid var(--nu-purple);
        outline-offset: 2px;
    }

    .recharts-tooltip-wrapper {
        z-index: 100 !important;
    }

    /* ═══════════════════════════════════════
       Tailwind utility overrides
       (translucent-white panels → Nu neutrals)
       ═══════════════════════════════════════ */
    .bg-white\/5,
    .bg-white\/6,
    .bg-white\/8,
    .bg-white\/10,
    .bg-white\/12 {
        background-color: var(--bg-subtle) !important;
    }

    .bg-white\/15,
    .bg-white\/20 {
        background-color: var(--bg-subtle-2) !important;
    }

    /* Inside accent gradient cards, restore semi-transparent whites */
    .bg-gradient-to-br.from-accent .bg-white\/5,
    .bg-gradient-to-br.from-accent .bg-white\/6,
    .bg-gradient-to-br.from-accent .bg-white\/8,
    .bg-gradient-to-br.from-accent .bg-white\/10,
    .bg-gradient-to-br.from-accent .bg-white\/12,
    .bg-gradient-to-br.from-accent .bg-white\/15,
    .bg-gradient-to-br.from-accent .bg-white\/20,
    .bg-gradient-to-br.from-accent .bg-white\/30 {
        background-color: rgba(255,255,255,0.18) !important;
    }
    .bg-gradient-to-br.from-accent .border-white\/20,
    .bg-gradient-to-br.from-accent .border-white\/30,
    .bg-gradient-to-br.from-accent .border-white\/50 {
        border-color: rgba(255,255,255,0.30) !important;
    }
    .bg-gradient-to-br.from-accent .hover\:bg-white\/20:hover,
    .bg-gradient-to-br.from-accent .hover\:bg-white\/30:hover,
    .bg-gradient-to-br.from-accent .hover\:bg-white\/90:hover {
        background-color: rgba(255,255,255,0.30) !important;
    }
    </style>
<script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "recharts": "https://esm.sh/recharts@^3.6.0",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2.45.1"
  }
}
</script>
</head>
<body>
    <div id="root"></div>
    <script>
        localStorage.removeItem('theme');
    </script>
<script type="module" src="/index.tsx"></script>
</body>
</html>
