
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EL DANES - Elite Finance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            deep:     'rgb(var(--deep-rgb) / <alpha-value>)',
            surface:  { DEFAULT: 'rgb(var(--surface-rgb) / <alpha-value>)', hover: 'rgb(var(--surface-hover-rgb) / <alpha-value>)' },
            elevated: 'rgb(var(--elevated-rgb) / <alpha-value>)',
            accent:   { DEFAULT: 'rgb(var(--accent-rgb) / <alpha-value>)', hover: 'rgb(var(--accent-hover-rgb) / <alpha-value>)', glow: 'rgb(var(--accent-rgb) / 0.20)' },
            success:  { DEFAULT: 'rgb(var(--success-rgb) / <alpha-value>)', glow: 'rgb(var(--success-rgb) / 0.15)' },
            warning:  { DEFAULT: 'rgb(var(--warning-rgb) / <alpha-value>)', glow: 'rgb(var(--warning-rgb) / 0.15)' },
            danger:   { DEFAULT: 'rgb(var(--danger-rgb) / <alpha-value>)', glow: 'rgb(var(--danger-rgb) / 0.15)' },
            dpurple:  { DEFAULT: 'rgb(var(--accent-rgb) / <alpha-value>)', glow: 'rgb(var(--accent-rgb) / 0.20)' },
            cyan:     { DEFAULT: 'rgb(var(--cyan-rgb) / <alpha-value>)' },
          },
          fontFamily: {
            sans: ['"Inter"', 'system-ui', 'sans-serif'],
          },
        }
      }
    }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap" rel="stylesheet">
    <style>
    /* ========================================
       ANTHROPIC LOOK — ElDANES
       Crema cálido, terracota, serif en títulos,
       diseño plano y sobrio.
       ======================================== */

    :root {
        /* RGB tokens (Tailwind opacity modifier support) */
        --deep-rgb:         250 249 245;
        --surface-rgb:      255 255 255;
        --surface-hover-rgb:247 245 240;
        --elevated-rgb:     255 255 255;

        --accent-rgb:       217 119 87;
        --accent-hover-rgb: 192 99 63;
        --success-rgb:      78 126 88;
        --warning-rgb:      199 144 43;
        --danger-rgb:       193 78 61;
        --cyan-rgb:         92 138 153;

        /* Brand */
        --clay:              #D97757;
        --clay-hover:        #C0633F;
        --clay-deep:         #9D4E2F;
        --clay-tint:         #F4E4DC;
        --ink:               #1A1915;

        /* Surfaces — crema cálido */
        --bg-page:           #FAF9F5;
        --bg-deep:           #FAF9F5;
        --bg-surface:        #FFFFFF;
        --bg-surface-hover:  #F7F5F0;
        --bg-elevated:       #FFFFFF;
        --bg-subtle:         #F0EEE6;
        --bg-subtle-2:       #E8E5DA;
        --bg-overlay:        rgba(26,25,21,0.40);

        /* Accent aliases (usados en TSX vía var()) */
        --accent:           var(--clay);
        --accent-hover:     var(--clay-hover);
        --accent-glow:      rgba(217,119,87,0.18);
        --accent-deep:      var(--clay-deep);

        --purple:           var(--clay);
        --purple-glow:      rgba(217,119,87,0.18);

        --success:          #4E7E58;
        --success-glow:     rgba(78,126,88,0.15);
        --success-tint:     #E5EEE6;
        --warning:          #C7902B;
        --warning-glow:     rgba(199,144,43,0.15);
        --warning-tint:     #F6ECD7;
        --danger:           #C14E3D;
        --danger-glow:      rgba(193,78,61,0.15);
        --danger-tint:      #F6DFDA;
        --cyan:             #5C8A99;

        /* Text */
        --text-primary:     #1A1915;
        --text-secondary:   #5E5D59;
        --text-tertiary:    #91908A;

        /* Borders */
        --border-subtle:    #EDEAE1;
        --border-default:   #E2DFD4;
        --border-hover:     #C9C5B8;
        --border-accent:    rgba(217,119,87,0.40);

        /* Legacy aliases (compatibilidad TSX) */
        --coin:             var(--clay);
        --coin-glow:        rgba(217,119,87,0.20);
        --pixel-shadow:     none;
        --pixel-shadow-sm:  none;
        --pixel-shadow-accent: none;
        --pixel-shadow-inset: none;
        --chrome-highlight: rgba(255,255,255,0.10);
        --chrome-shadow:    rgba(26,25,21,0.04);

        /* Brand legacy (algunos TSX referencian --nu-*) */
        --nu-purple:         var(--clay);
        --nu-purple-hover:   var(--clay-hover);
        --nu-purple-deep:    var(--clay-deep);
        --nu-purple-tint:    var(--clay-tint);
        --nu-purple-tint-2:  #EFD8CC;

        /* Sombras — apenas perceptibles */
        --shadow-card:      0 1px 2px rgba(26,25,21,0.04);
        --shadow-card-hover:0 1px 3px rgba(26,25,21,0.05), 0 6px 20px rgba(26,25,21,0.06);
        --shadow-pop:       0 12px 32px rgba(26,25,21,0.12);
    }

    *, *::before, *::after { box-sizing: border-box; }

    /* ═══════════════════════════════════════
       BODY
       ═══════════════════════════════════════ */
    body {
        font-family: 'Inter', system-ui, sans-serif;
        -webkit-tap-highlight-color: transparent;
        overflow-x: hidden;
        background-color: var(--bg-page);
        background-image: none;
        color: var(--text-primary);
        min-height: 100vh;
        min-height: 100dvh;
        font-size: 15px;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
    }

    /* ═══════════════════════════════════════
       TIPOGRAFÍA — serif para títulos
       ═══════════════════════════════════════ */
    h1, h2, h3, h4, .font-display {
        font-family: 'Source Serif 4', Georgia, serif;
        font-weight: 600;
        color: var(--text-primary);
        line-height: 1.25;
        letter-spacing: -0.005em;
    }

    .font-mono {
        font-family: 'Inter', system-ui, sans-serif;
        font-weight: 500;
        font-variant-numeric: tabular-nums;
    }

    input, textarea, select {
        font-size: 16px !important;
        font-family: 'Inter', system-ui, sans-serif !important;
    }

    @media screen and (min-width: 768px) {
        input, textarea, select { font-size: inherit !important; }
    }

    /* ═══════════════════════════════════════
       TARJETAS — blanco plano sobre crema
       ═══════════════════════════════════════ */
    .glass-card {
        background: var(--bg-surface);
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
        border: 1px solid var(--border-default);
        border-radius: 14px;
        box-shadow: var(--shadow-card);
        transition: border-color 200ms ease-out, box-shadow 200ms ease-out;
        position: relative;
        overflow: hidden;
    }

    .glass-card:hover {
        border-color: var(--border-hover);
        box-shadow: var(--shadow-card-hover);
    }

    /* Variantes de estado: tinte sutil del borde según el semáforo */
    .glass-card.glass-green  { border-color: #C3D6C6; }
    .glass-card.glass-yellow { border-color: #E4D2A8; }
    .glass-card.glass-red    { border-color: #E3BCB4; }
    .glass-card.glass-purple { border-color: #E8C5B5; }
    .glass-card.glass-blue   { border-color: #C5D5DC; }

    .glass-card.glass-green:hover  { border-color: #9DBCA3; }
    .glass-card.glass-yellow:hover { border-color: #D3B97A; }
    .glass-card.glass-red:hover    { border-color: #D29A8E; }
    .glass-card.glass-purple:hover { border-color: #DCA98F; }
    .glass-card.glass-blue:hover   { border-color: #A3BEC9; }

    /* ═══════════════════════════════════════
       NAVEGACIÓN
       ═══════════════════════════════════════ */
    .nav-glass {
        background: rgba(250,249,245,0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border: 1px solid var(--border-default);
        box-shadow: var(--shadow-card);
    }

    header.nav-glass {
        border-left: none;
        border-right: none;
        border-top: none;
        border-radius: 0;
        box-shadow: none;
        border-bottom: 1px solid var(--border-default);
    }

    /* ═══════════════════════════════════════
       INPUTS
       ═══════════════════════════════════════ */
    .input-glass {
        background: var(--bg-surface);
        border: 1px solid var(--border-default);
        border-radius: 10px;
        color: var(--text-primary);
        transition: border-color 150ms ease-out, box-shadow 150ms ease-out;
        font-family: 'Inter', system-ui, sans-serif;
    }

    .input-glass:focus {
        outline: none;
        border-color: var(--clay);
        box-shadow: 0 0 0 3px rgba(217,119,87,0.15);
    }

    .input-glass::placeholder {
        color: var(--text-tertiary);
    }

    /* ═══════════════════════════════════════
       BOTONES
       ═══════════════════════════════════════ */
    .btn-primary {
        background: var(--clay);
        border: none;
        color: #FFFFFF;
        font-weight: 600;
        font-family: 'Inter', system-ui, sans-serif;
        font-size: 14px;
        border-radius: 10px;
        cursor: pointer;
        box-shadow: 0 1px 2px rgba(26,25,21,0.08);
        transition: background 150ms ease-out, box-shadow 150ms ease-out, transform 100ms ease-out;
        position: relative;
        overflow: hidden;
    }

    .btn-primary:hover {
        background: var(--clay-hover);
        box-shadow: 0 2px 8px rgba(217,119,87,0.30);
    }

    .btn-primary:active {
        transform: translateY(1px);
        box-shadow: 0 1px 2px rgba(26,25,21,0.08);
    }

    .btn-primary:disabled {
        opacity: 0.40;
        pointer-events: none;
    }

    .btn-secondary {
        background: var(--bg-surface);
        border: 1px solid var(--border-default);
        color: var(--text-primary);
        font-family: 'Inter', system-ui, sans-serif;
        font-weight: 500;
        border-radius: 10px;
        cursor: pointer;
        transition: border-color 150ms ease-out, background 150ms ease-out;
    }

    .btn-secondary:hover {
        border-color: var(--border-hover);
        background: var(--bg-subtle);
        color: var(--ink);
    }

    .btn-danger {
        background: var(--bg-surface);
        border: 1px solid var(--danger);
        color: var(--danger);
        font-family: 'Inter', system-ui, sans-serif;
        font-weight: 500;
        border-radius: 10px;
        cursor: pointer;
        transition: background 150ms ease-out, border-color 150ms ease-out;
    }

    .btn-danger:hover {
        background: var(--danger-tint);
        border-color: var(--danger);
    }

    /* ═══════════════════════════════════════
       METRIC CARDS
       ═══════════════════════════════════════ */
    .metric-card {
        background: var(--bg-surface);
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
        border: 1px solid var(--border-default);
        border-radius: 14px;
        overflow: hidden;
        transition: border-color 200ms ease-out, box-shadow 200ms ease-out;
        position: relative;
        box-shadow: var(--shadow-card);
    }

    .metric-card:hover {
        border-color: var(--border-hover);
        box-shadow: var(--shadow-card-hover);
    }

    /* ═══════════════════════════════════════
       SCROLLBAR
       ═══════════════════════════════════════ */
    ::-webkit-scrollbar { width: 8px; height: 8px; }

    ::-webkit-scrollbar-track { background: transparent; }

    ::-webkit-scrollbar-thumb {
        background: #D3D0C5;
        border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
        background: #B9B5A7;
    }

    ::-webkit-scrollbar-corner { background: transparent; }

    /* Hide number input spinners */
    input::-webkit-outer-spin-button,
    input::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
    }
    input[type=number] { -moz-appearance: textfield; }

    /* ═══════════════════════════════════════
       ANIMACIONES
       ═══════════════════════════════════════ */
    @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(8px); }
        to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeIn {
        from { opacity: 0; }
        to   { opacity: 1; }
    }

    @keyframes slideInFromBottom {
        from { opacity: 0; transform: translateY(16px); }
        to   { opacity: 1; transform: translateY(0); }
    }

    .animate-fade-in-up  { animation: fadeInUp 0.25s ease-out forwards; }
    .animate-fade-in     { animation: fadeIn 0.20s ease-out forwards; }
    .animate-slide-up    { animation: slideInFromBottom 0.28s ease-out forwards; }

    .delay-100 { animation-delay: 100ms; }
    .delay-200 { animation-delay: 200ms; }
    .delay-300 { animation-delay: 300ms; }
    .delay-400 { animation-delay: 400ms; }
    .delay-500 { animation-delay: 500ms; }

    /* ═══════════════════════════════════════
       BADGES — píldoras suaves
       ═══════════════════════════════════════ */
    .badge {
        display: inline-flex;
        align-items: center;
        padding: 4px 12px;
        border-radius: 9999px;
        font-size: 12px;
        font-weight: 600;
        font-family: 'Inter', system-ui, sans-serif;
        letter-spacing: 0;
        border: 1px solid transparent;
    }

    .badge-success {
        background: var(--success-tint);
        color: #3D6647;
        border-color: transparent;
    }

    .badge-warning {
        background: var(--warning-tint);
        color: #8A6116;
        border-color: transparent;
    }

    .badge-danger {
        background: var(--danger-tint);
        color: #993F30;
        border-color: transparent;
    }

    .badge-info {
        background: var(--clay-tint);
        color: var(--clay-deep);
        border-color: transparent;
    }

    /* ═══════════════════════════════════════
       MODAL OVERLAY
       ═══════════════════════════════════════ */
    .modal-overlay {
        background: rgba(26,25,21,0.40);
    }

    /* ═══════════════════════════════════════
       TABLA
       ═══════════════════════════════════════ */
    .table-glass {
        background: var(--bg-surface);
        border-radius: 14px;
        border: 1px solid var(--border-default);
        overflow: hidden;
        box-shadow: var(--shadow-card);
    }

    .table-glass th {
        background: var(--bg-subtle);
        color: var(--text-secondary);
        font-weight: 600;
        font-family: 'Inter', system-ui, sans-serif;
        text-transform: none;
        font-size: 12px;
        letter-spacing: 0;
        border-bottom: 1px solid var(--border-default);
    }

    .table-glass tr {
        border-bottom: 1px solid var(--border-subtle);
        transition: background 150ms ease-out;
    }

    .table-glass tr:hover {
        background: #F7F1EC;
    }

    .table-glass tr:last-child {
        border-bottom: none;
    }

    /* ═══════════════════════════════════════
       TEXTO DE COLOR
       ═══════════════════════════════════════ */
    .text-accent  { color: var(--clay-deep) !important; }
    .text-success { color: #3D6647 !important; }
    .text-warning { color: #8A6116 !important; }
    .text-danger  { color: var(--danger) !important; }
    .text-dpurple { color: var(--clay-deep) !important; }
    .text-cyan    { color: #45707E !important; }

    /* ═══════════════════════════════════════
       SELECTION & FOCUS
       ═══════════════════════════════════════ */
    ::selection {
        background: rgba(217,119,87,0.25);
        color: var(--text-primary);
    }

    :focus-visible {
        outline: 2px solid var(--clay);
        outline-offset: 2px;
    }

    .recharts-tooltip-wrapper {
        z-index: 100 !important;
    }

    /* ═══════════════════════════════════════
       Overrides utilidades Tailwind
       (paneles blanco-translúcido → neutros cálidos)
       ═══════════════════════════════════════ */
    .bg-white\/5,
    .bg-white\/6,
    .bg-white\/8,
    .bg-white\/10,
    .bg-white\/12 {
        background-color: var(--bg-subtle) !important;
    }

    .bg-white\/15,
    .bg-white\/20 {
        background-color: var(--bg-subtle-2) !important;
    }

    /* Dentro de tarjetas con gradiente de acento, blancos semitransparentes reales */
    .bg-gradient-to-br.from-accent .bg-white\/5,
    .bg-gradient-to-br.from-accent .bg-white\/6,
    .bg-gradient-to-br.from-accent .bg-white\/8,
    .bg-gradient-to-br.from-accent .bg-white\/10,
    .bg-gradient-to-br.from-accent .bg-white\/12,
    .bg-gradient-to-br.from-accent .bg-white\/15,
    .bg-gradient-to-br.from-accent .bg-white\/20,
    .bg-gradient-to-br.from-accent .bg-white\/30 {
        background-color: rgba(255,255,255,0.18) !important;
    }
    .bg-gradient-to-br.from-accent .border-white\/20,
    .bg-gradient-to-br.from-accent .border-white\/30,
    .bg-gradient-to-br.from-accent .border-white\/50 {
        border-color: rgba(255,255,255,0.30) !important;
    }
    .bg-gradient-to-br.from-accent .hover\:bg-white\/20:hover,
    .bg-gradient-to-br.from-accent .hover\:bg-white\/30:hover,
    .bg-gradient-to-br.from-accent .hover\:bg-white\/90:hover {
        background-color: rgba(255,255,255,0.30) !important;
    }
    </style>
<script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "recharts": "https://esm.sh/recharts@^3.6.0",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2.45.1"
  }
}
</script>
</head>
<body>
    <div id="root"></div>
    <script>
        localStorage.removeItem('theme');
    </script>
<script type="module" src="/index.tsx"></script>
</body>
</html>
