<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0E1411">
    <meta name="color-scheme" content="dark">
    <title>EL DANES - Elite Finance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            deep:     'rgb(var(--deep-rgb) / <alpha-value>)',
            surface:  { DEFAULT: 'rgb(var(--surface-rgb) / <alpha-value>)', hover: 'rgb(var(--surface-hover-rgb) / <alpha-value>)' },
            elevated: 'rgb(var(--elevated-rgb) / <alpha-value>)',
            accent:   { DEFAULT: 'rgb(var(--accent-rgb) / <alpha-value>)', hover: 'rgb(var(--accent-hover-rgb) / <alpha-value>)', glow: 'rgb(var(--accent-rgb) / 0.22)' },
            success:  { DEFAULT: 'rgb(var(--success-rgb) / <alpha-value>)', glow: 'rgb(var(--success-rgb) / 0.18)' },
            warning:  { DEFAULT: 'rgb(var(--warning-rgb) / <alpha-value>)', glow: 'rgb(var(--warning-rgb) / 0.18)' },
            danger:   { DEFAULT: 'rgb(var(--danger-rgb) / <alpha-value>)', glow: 'rgb(var(--danger-rgb) / 0.18)' },
            dpurple:  { DEFAULT: 'rgb(var(--accent-rgb) / <alpha-value>)', glow: 'rgb(var(--accent-rgb) / 0.22)' },
            cyan:     { DEFAULT: 'rgb(var(--cyan-rgb) / <alpha-value>)' },
          },
          fontFamily: {
            sans: ['"Instrument Sans"', 'system-ui', 'sans-serif'],
          },
        }
      }
    }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,500;9..144,600;9..144,700,50&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
    /* ========================================
       LIBRO MAYOR NOCTURNO — ElDANES
       Tinta verde-negra con grano, latón como
       único acento, crema para el texto.
       Serif Fraunces en títulos, Instrument Sans
       en cuerpo, JetBrains Mono tabular para el
       dinero. Un solo tema, comprometido.
       ======================================== */

    :root {
        /* RGB tokens (Tailwind opacity modifier support) */
        --deep-rgb:          14 20 17;
        --surface-rgb:       23 31 27;
        --surface-hover-rgb: 30 40 35;
        --elevated-rgb:      29 38 34;

        --accent-rgb:        217 164 65;
        --accent-hover-rgb:  232 182 90;
        --success-rgb:       93 190 138;
        --warning-rgb:       232 133 58;
        --danger-rgb:        227  86  79;
        --cyan-rgb:          111 183 201;

        /* Brand — latón */
        --brass:             #D9A441;
        --brass-hover:       #E8B65A;
        --brass-deep:        #A87A22;
        --brass-bright:      #F1CB6E;
        --brass-tint:        rgba(217,164,65,0.14);
        --on-accent:         #15110A;
        --ink:               #0E1411;
        --cream:             #F2ECDD;

        /* Surfaces — tinta verde-negra */
        --bg-page:           #0E1411;
        --bg-deep:           #0E1411;
        --bg-surface:        #171F1B;
        --bg-surface-hover:  #1E2823;
        --bg-elevated:       #1D2622;
        --bg-subtle:         rgba(242,236,221,0.05);
        --bg-subtle-2:       rgba(242,236,221,0.09);
        --bg-overlay:        rgba(6,10,8,0.72);

        /* Accent aliases (usados en TSX vía var()) */
        --accent:            var(--brass);
        --accent-hover:      var(--brass-hover);
        --accent-glow:       rgba(217,164,65,0.22);
        --accent-deep:       var(--brass-deep);

        --purple:            var(--brass);
        --purple-glow:       rgba(217,164,65,0.22);

        --success:           #5DBE8A;
        --success-glow:      rgba(93,190,138,0.18);
        --success-tint:      rgba(93,190,138,0.14);
        --warning:           #E8853A;
        --warning-glow:      rgba(232,133,58,0.18);
        --warning-tint:      rgba(232,133,58,0.14);
        --danger:            #E3564F;
        --danger-glow:       rgba(227,86,79,0.18);
        --danger-tint:       rgba(227,86,79,0.14);
        --cyan:              #6FB7C9;

        /* Text — crema en tres pesos */
        --text-primary:      #F2ECDD;
        --text-secondary:    #B9B2A1;
        --text-tertiary:     #8B8679;

        /* Borders — hairlines de crema */
        --border-subtle:     rgba(242,236,221,0.06);
        --border-default:    rgba(242,236,221,0.10);
        --border-hover:      rgba(242,236,221,0.20);
        --border-accent:     rgba(217,164,65,0.45);

        /* Legacy aliases (compatibilidad TSX) */
        --clay:              var(--brass);
        --clay-hover:        var(--brass-hover);
        --clay-deep:         var(--brass-deep);
        --clay-tint:         var(--brass-tint);
        --coin:              var(--brass);
        --coin-glow:         rgba(217,164,65,0.24);
        --pixel-shadow:      none;
        --pixel-shadow-sm:   none;
        --pixel-shadow-accent: none;
        --pixel-shadow-inset: none;
        --chrome-highlight:  rgba(242,236,221,0.08);
        --chrome-shadow:     rgba(0,0,0,0.30);
        --nu-purple:         var(--brass);
        --nu-purple-hover:   var(--brass-hover);
        --nu-purple-deep:    var(--brass-deep);
        --nu-purple-tint:    var(--brass-tint);
        --nu-purple-tint-2:  rgba(217,164,65,0.22);

        /* Sombras — profundas, con un filo de luz arriba */
        --edge-light:        inset 0 1px 0 rgba(242,236,221,0.06);
        --shadow-card:       var(--edge-light), 0 1px 2px rgba(0,0,0,0.30), 0 8px 24px -12px rgba(0,0,0,0.55);
        --shadow-card-hover: var(--edge-light), 0 2px 4px rgba(0,0,0,0.35), 0 18px 40px -16px rgba(0,0,0,0.70);
        --shadow-pop:        var(--edge-light), 0 24px 64px -16px rgba(0,0,0,0.80);
    }

    *, *::before, *::after { box-sizing: border-box; }

    html { background-color: var(--bg-page); }

    /* ═══════════════════════════════════════
       BODY — atmósfera: halo de latón arriba a
       la izquierda, verde profundo abajo, grano.
       ═══════════════════════════════════════ */
    body {
        font-family: 'Instrument Sans', system-ui, sans-serif;
        -webkit-tap-highlight-color: transparent;
        overflow-x: hidden;
        background-color: var(--bg-page);
        background-image:
            radial-gradient(1100px 620px at 8% -10%, rgba(217,164,65,0.14), transparent 60%),
            radial-gradient(900px 700px at 100% 110%, rgba(93,190,138,0.09), transparent 60%),
            linear-gradient(180deg, #101713 0%, var(--bg-page) 100%);
        background-attachment: fixed;
        color: var(--text-primary);
        min-height: 100vh;
        min-height: 100dvh;
        font-size: 15px;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
    }

    /* Grano fino, fijo, por debajo de todo el contenido (los contenedores usan z-10) */
    body::before {
        content: '';
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        opacity: 0.32;
        mix-blend-mode: soft-light;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.95  0 0 0 0 0.93  0 0 0 0 0.87  0 0 0 0.9 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
        background-size: 160px 160px;
    }

    /* ═══════════════════════════════════════
       TIPOGRAFÍA — serif con carácter en títulos,
       cifras tabulares en mono
       ═══════════════════════════════════════ */
    h1, h2, h3, h4, .font-display {
        font-family: 'Fraunces', Georgia, serif;
        font-weight: 600;
        font-variation-settings: 'opsz' 40, 'SOFT' 50;
        color: var(--text-primary);
        line-height: 1.2;
        letter-spacing: -0.012em;
    }

    h1 { font-variation-settings: 'opsz' 96, 'SOFT' 50; letter-spacing: -0.02em; }

    .font-mono {
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        font-weight: 600;
        font-variant-numeric: tabular-nums slashed-zero;
        letter-spacing: -0.02em;
    }

    input, textarea, select {
        font-size: 16px !important;
        font-family: 'Instrument Sans', system-ui, sans-serif !important;
        color-scheme: dark;
    }

    input.font-mono, .font-mono input {
        font-family: 'JetBrains Mono', ui-monospace, monospace !important;
    }

    @media screen and (min-width: 768px) {
        input, textarea, select { font-size: inherit !important; }
    }

    /* ═══════════════════════════════════════
       TARJETAS — superficie oscura con filo de luz
       y franja lateral según el semáforo
       ═══════════════════════════════════════ */
    .glass-card {
        background: linear-gradient(180deg, rgba(242,236,221,0.025), transparent 40%), var(--bg-surface);
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
        border: 1px solid var(--border-default);
        border-radius: 16px;
        box-shadow: var(--shadow-card);
        transition: border-color 220ms ease-out, box-shadow 220ms ease-out, transform 220ms cubic-bezier(.2,.8,.2,1);
        position: relative;
        overflow: hidden;
    }

    .glass-card:hover {
        border-color: var(--border-hover);
        box-shadow: var(--shadow-card-hover);
    }

    /* Franja lateral de estado: 3px de color puro + tinte que se desvanece */
    .glass-card.glass-green,
    .glass-card.glass-yellow,
    .glass-card.glass-red,
    .glass-card.glass-purple,
    .glass-card.glass-blue { --status: var(--brass); }

    .glass-card.glass-green  { --status: var(--success); }
    .glass-card.glass-yellow { --status: var(--warning); }
    .glass-card.glass-red    { --status: var(--danger); }
    .glass-card.glass-blue   { --status: var(--cyan); }

    .glass-card.glass-green::before,
    .glass-card.glass-yellow::before,
    .glass-card.glass-red::before,
    .glass-card.glass-purple::before,
    .glass-card.glass-blue::before {
        content: '';
        position: absolute;
        left: 0; top: 0; bottom: 0;
        width: 3px;
        background: var(--status);
        box-shadow: 0 0 18px 2px color-mix(in srgb, var(--status) 55%, transparent);
        z-index: 1;
        pointer-events: none;
    }

    .glass-card.glass-green::after,
    .glass-card.glass-yellow::after,
    .glass-card.glass-red::after,
    .glass-card.glass-purple::after,
    .glass-card.glass-blue::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, color-mix(in srgb, var(--status) 10%, transparent), transparent 42%);
        pointer-events: none;
        z-index: 0;
    }

    .glass-card.glass-green:hover,
    .glass-card.glass-yellow:hover,
    .glass-card.glass-red:hover,
    .glass-card.glass-purple:hover,
    .glass-card.glass-blue:hover {
        border-color: color-mix(in srgb, var(--status) 45%, var(--border-default));
    }

    /* ═══════════════════════════════════════
       NAVEGACIÓN — tinta translúcida con blur,
       hilo de latón en el borde superior
       ═══════════════════════════════════════ */
    .nav-glass {
        background: rgba(14,20,17,0.78);
        backdrop-filter: blur(16px) saturate(1.2);
        -webkit-backdrop-filter: blur(16px) saturate(1.2);
        border: 1px solid var(--border-default);
        box-shadow: var(--shadow-card);
    }

    nav.nav-glass {
        background-image: linear-gradient(180deg, rgba(242,236,221,0.04), transparent 50%);
    }

    header.nav-glass {
        border-left: none;
        border-right: none;
        border-top: none;
        border-radius: 0;
        box-shadow: none;
        border-bottom: 1px solid var(--border-default);
        background-image: linear-gradient(90deg, transparent, rgba(217,164,65,0.55) 50%, transparent);
        background-size: 100% 1px;
        background-repeat: no-repeat;
        background-position: top;
    }

    /* ═══════════════════════════════════════
       INPUTS — hundidos en la superficie, foco latón
       ═══════════════════════════════════════ */
    .input-glass {
        background: rgba(6,10,8,0.45);
        border: 1px solid var(--border-default);
        border-radius: 12px;
        color: var(--text-primary);
        box-shadow: inset 0 1px 2px rgba(0,0,0,0.35);
        transition: border-color 150ms ease-out, box-shadow 150ms ease-out, background 150ms ease-out;
        font-family: 'Instrument Sans', system-ui, sans-serif;
    }

    .input-glass:hover { border-color: var(--border-hover); }

    .input-glass:focus {
        outline: none;
        background: rgba(6,10,8,0.60);
        border-color: var(--brass);
        box-shadow: inset 0 1px 2px rgba(0,0,0,0.35), 0 0 0 3px rgba(217,164,65,0.18);
    }

    .input-glass::placeholder { color: var(--text-tertiary); }

    /* ═══════════════════════════════════════
       BOTONES — latón sólido con texto tinta;
       secundarios como hairline
       ═══════════════════════════════════════ */
    .btn-primary {
        background: linear-gradient(180deg, var(--brass-hover), var(--brass) 55%, #C9942F);
        border: 1px solid rgba(255,225,160,0.35);
        color: var(--on-accent) !important;
        font-weight: 700;
        font-family: 'Instrument Sans', system-ui, sans-serif;
        font-size: 14px;
        border-radius: 12px;
        cursor: pointer;
        box-shadow: inset 0 1px 0 rgba(255,240,200,0.45), 0 1px 2px rgba(0,0,0,0.40), 0 8px 20px -8px rgba(217,164,65,0.55);
        transition: filter 150ms ease-out, box-shadow 150ms ease-out, transform 100ms ease-out;
        position: relative;
        overflow: hidden;
    }

    .btn-primary:hover {
        filter: brightness(1.06);
        box-shadow: inset 0 1px 0 rgba(255,240,200,0.55), 0 2px 4px rgba(0,0,0,0.40), 0 12px 28px -8px rgba(217,164,65,0.70);
    }

    .btn-primary:active {
        transform: translateY(1px);
        filter: brightness(0.97);
    }

    .btn-primary:disabled {
        opacity: 0.40;
        pointer-events: none;
    }

    .btn-secondary {
        background: var(--bg-subtle);
        border: 1px solid var(--border-default);
        color: var(--text-primary);
        font-family: 'Instrument Sans', system-ui, sans-serif;
        font-weight: 600;
        border-radius: 12px;
        cursor: pointer;
        transition: border-color 150ms ease-out, background 150ms ease-out;
    }

    .btn-secondary:hover {
        border-color: var(--border-hover);
        background: var(--bg-subtle-2);
        color: var(--cream);
    }

    .btn-danger {
        background: var(--danger-tint);
        border: 1px solid rgba(227,86,79,0.40);
        color: #F5928C;
        font-family: 'Instrument Sans', system-ui, sans-serif;
        font-weight: 600;
        border-radius: 12px;
        cursor: pointer;
        transition: background 150ms ease-out, border-color 150ms ease-out;
    }

    .btn-danger:hover {
        background: rgba(227,86,79,0.24);
        border-color: var(--danger);
    }

    /* ═══════════════════════════════════════
       METRIC CARDS — mismas reglas que las tarjetas
       ═══════════════════════════════════════ */
    .metric-card {
        background: linear-gradient(180deg, rgba(242,236,221,0.025), transparent 40%), var(--bg-surface);
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
        border: 1px solid var(--border-default);
        border-radius: 16px;
        overflow: hidden;
        transition: border-color 220ms ease-out, box-shadow 220ms ease-out;
        position: relative;
        box-shadow: var(--shadow-card);
    }

    .metric-card:hover {
        border-color: var(--border-hover);
        box-shadow: var(--shadow-card-hover);
    }

    /* ═══════════════════════════════════════
       SCROLLBAR
       ═══════════════════════════════════════ */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(242,236,221,0.14); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(242,236,221,0.26); }
    ::-webkit-scrollbar-corner { background: transparent; }

    input::-webkit-outer-spin-button,
    input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    input[type=number] { -moz-appearance: textfield; }
    input[type=date]::-webkit-calendar-picker-indicator { filter: invert(0.85) sepia(0.4) saturate(2) hue-rotate(5deg); cursor: pointer; }

    /* ═══════════════════════════════════════
       ANIMACIONES
       ═══════════════════════════════════════ */
    @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(10px); }
        to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
        from { opacity: 0; }
        to   { opacity: 1; }
    }
    @keyframes slideInFromBottom {
        from { opacity: 0; transform: translateY(18px) scale(0.985); }
        to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .animate-fade-in-up  { animation: fadeInUp 0.32s cubic-bezier(.2,.8,.2,1) both; }
    .animate-fade-in     { animation: fadeIn 0.22s ease-out both; }
    .animate-slide-up    { animation: slideInFromBottom 0.30s cubic-bezier(.2,.8,.2,1) both; }

    .delay-100 { animation-delay: 100ms; }
    .delay-200 { animation-delay: 200ms; }
    .delay-300 { animation-delay: 300ms; }
    .delay-400 { animation-delay: 400ms; }
    .delay-500 { animation-delay: 500ms; }

    @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }

    /* ═══════════════════════════════════════
       BADGES — píldoras tintadas con texto claro
       ═══════════════════════════════════════ */
    .badge {
        display: inline-flex;
        align-items: center;
        padding: 4px 12px;
        border-radius: 9999px;
        font-size: 12px;
        font-weight: 600;
        font-family: 'Instrument Sans', system-ui, sans-serif;
        letter-spacing: 0.01em;
        border: 1px solid transparent;
    }

    .badge-success { background: var(--success-tint); color: #8BDCB0; border-color: rgba(93,190,138,0.28); }
    .badge-warning { background: var(--warning-tint); color: #F3AE78; border-color: rgba(232,133,58,0.28); }
    .badge-danger  { background: var(--danger-tint);  color: #F5928C; border-color: rgba(227,86,79,0.28); }
    .badge-info    { background: var(--brass-tint);   color: var(--brass-bright); border-color: rgba(217,164,65,0.30); }

    /* ═══════════════════════════════════════
       MODAL OVERLAY
       ═══════════════════════════════════════ */
    .modal-overlay { background: var(--bg-overlay); }

    /* ═══════════════════════════════════════
       TABLA
       ═══════════════════════════════════════ */
    .table-glass {
        background: var(--bg-surface);
        border-radius: 16px;
        border: 1px solid var(--border-default);
        overflow: hidden;
        box-shadow: var(--shadow-card);
    }

    .table-glass th {
        background: rgba(6,10,8,0.35);
        color: var(--text-secondary);
        font-weight: 600;
        font-family: 'Instrument Sans', system-ui, sans-serif;
        text-transform: uppercase;
        font-size: 11px;
        letter-spacing: 0.08em;
        border-bottom: 1px solid var(--border-default);
    }

    .table-glass tr {
        border-bottom: 1px solid var(--border-subtle);
        transition: background 150ms ease-out;
    }

    .table-glass tr:hover { background: rgba(217,164,65,0.05); }
    .table-glass tr:last-child { border-bottom: none; }

    /* ═══════════════════════════════════════
       TEXTO DE COLOR — variantes claras para
       leer sobre tinta
       ═══════════════════════════════════════ */
    .text-accent  { color: #E4B75A !important; }
    .text-success { color: #6CCB93 !important; }
    .text-warning { color: #F0A04B !important; }
    .text-danger  { color: #F0736B !important; }
    .text-dpurple { color: #E4B75A !important; }
    .text-cyan    { color: #86C7D8 !important; }

    /* Rellenos sólidos de acento: el texto e íconos van en tinta, nunca en blanco */
    .bg-accent, .bg-accent.text-white, .bg-accent .text-white,
    .bg-dpurple, .bg-dpurple.text-white,
    .bg-warning, .bg-warning.text-white,
    .bg-success, .bg-success.text-white,
    .bg-danger, .bg-danger.text-white {
        color: var(--on-accent) !important;
    }

    .bg-accent { background-image: linear-gradient(180deg, rgba(255,240,200,0.18), transparent 60%); }
    .bg-accent:hover { filter: brightness(1.06); }

    /* ═══════════════════════════════════════
       SELECTION & FOCUS
       ═══════════════════════════════════════ */
    ::selection { background: rgba(217,164,65,0.35); color: var(--cream); }

    :focus-visible {
        outline: 2px solid var(--brass);
        outline-offset: 2px;
        border-radius: 6px;
    }

    .recharts-tooltip-wrapper { z-index: 100 !important; }
    .recharts-cartesian-grid line { stroke: rgba(242,236,221,0.08) !important; }

    /* ═══════════════════════════════════════
       Overrides utilidades Tailwind
       (paneles blancos translúcidos → crema
       tenue sobre tinta; blancos sólidos → superficie)
       ═══════════════════════════════════════ */
    .bg-white\/5,
    .bg-white\/6,
    .bg-white\/8,
    .bg-white\/10,
    .bg-white\/12 { background-color: var(--bg-subtle) !important; }

    .bg-white\/15,
    .bg-white\/20 { background-color: var(--bg-subtle-2) !important; }

    .hover\:bg-white\/10:hover,
    .hover\:bg-white\/12:hover { background-color: var(--bg-subtle-2) !important; }

    .bg-white,
